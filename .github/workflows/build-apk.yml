name: Build APK

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore stable debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${DEBUG_KEYSTORE_BASE64}" ]; then
            if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "::error::Repository secret DEBUG_KEYSTORE_BASE64 is required on main so debug APK signatures stay stable."
              exit 1
            fi
            echo "::warning::DEBUG_KEYSTORE_BASE64 is unavailable. assembleDebug will generate a one-off keystore and the APK cannot overwrite previously installed builds."
            exit 0
          fi
          mkdir -p "${HOME}/.android"
          printf '%s' "${DEBUG_KEYSTORE_BASE64}" | base64 -d > "${HOME}/.android/debug.keystore"
          chmod 600 "${HOME}/.android/debug.keystore"
          if [ ! -s "${HOME}/.android/debug.keystore" ]; then
            echo "::error::Decoded debug.keystore is empty. Check DEBUG_KEYSTORE_BASE64."
            exit 1
          fi
          keytool -list -keystore "${HOME}/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webp-converter-build-log
          path: build.log
          if-no-files-found: warn

      - name: Report build failure
        if: failure()
        run: |
          summary=$(grep -E -i 'FAILURE:|What went wrong|Caused by:|(^|[[:space:]])error:' build.log | tail -n 20 | tr '\n' ' ' | tr '\r' ' ')
          echo "::error file=app/build.gradle.kts,line=1::$summary"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: webp-converter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
